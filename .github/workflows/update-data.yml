name: Update closing data

on:
  schedule:
    # 台北時間週一至週五 15:17 與 18:17（UTC 07:17、10:17），收盤資料公布後
    - cron: '17 7,10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch TWSE closes
        run: node scripts/update-data.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data.json && git ls-files --error-unmatch data.json >/dev/null 2>&1; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update closing data $(jq -r .date data.json)"
          git push
